[project]
name = "light-my-cells-2"
version = "0.1.0"
description = "Light My Cells: transmitted-light to fluorescence organelle images (data preparation, training, inference)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.2.0",
    "ipykernel>=7.4.0",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tifffile>=2026.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
